# What publishes, and where.
#
# Everything under publish_dir is synced 1:1 to write_prefix. Data files are
# never placed under publish_dir, so they cannot be published by accident.
#

# The S3 URI uploads are written to. Copy it from your storage provider.
write_prefix: s3://portolan-mirrors/gwl-fcs30d

# The public base URL that serves write_prefix. Every href in the catalog is
# built from this, so it goes in the STAC JSON and write_prefix does not.
public_base: https://data.source.coop/portolan-mirrors/gwl-fcs30d

region: us-west-2

# The named AWS profile the publisher uses. Optional. Leave it commented out
# to use the default boto3 session. Source Cooperative issues per-account
# credentials, so set the profile name you stored them under.
# The profile from https://docs.source.coop/upload-with-the-cli: credential_process =
# source-coop creds, endpoint_url = https://data.source.coop.
profile: source-coop

# The directory that IS the published catalog, synced 1:1 to write_prefix.
# Nothing outside it is ever uploaded.
publish_dir: catalog

# The staging directory that holds data files, read by tools/upload_data.py.
# Optional. Leave it commented out if you stage no data. tools/publish.py
# never reads this key, so setting it does not widen the publish boundary.
# Data files are too large for git, so keep this directory out of the
# repository or ignored by it. Only the suffixes in PUBLISHABLE_SUFFIXES
# upload. See the allow-list in tools/upload_data.py.
data_dir: ../gwl-fcs30d-data/staging

# Navigation targets (portolan-bootstrap reference/catalog-navigation.md).
# tools/build_stac.py writes them into every catalog, collection and README.
repository: https://github.com/nlebovits/gwl-fcs30d
hosting_page: https://source.coop/portolan-mirrors/gwl-fcs30d
browser_route: https://browser.portolan-sdi.org/#/external
